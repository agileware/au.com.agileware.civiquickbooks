name: Init release

on:
  workflow_dispatch:
    inputs:
      EXCLUDE_PATHS:
        description: 'Space-separated repo-relative paths to drop from the release branch (e.g. ".github tests .idea")'
        required: true
        default: '.github composer.lock tests .idea .gitignore CONTRIBUTING.md DEVELOPERS.md'
        type: string

permissions:
  contents: write

jobs:
  init-release:
    uses: agileware/ci-workflows/.github/workflows/civicrm-extension-init-release.yml@main
    secrets:
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
    with:
      EXCLUDE_PATHS: ${{ inputs.EXCLUDE_PATHS }}
