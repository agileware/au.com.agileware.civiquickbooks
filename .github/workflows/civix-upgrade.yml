name: civix upgrade
on:
  workflow_dispatch: {}

jobs:
  civix-upgrade:
    uses: agileware/ci-workflows/.github/workflows/civix-upgrade.yml@main
    secrets:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      EXTENSION_NAME: au.com.agileware.civiquickbooks
