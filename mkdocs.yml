site_name: QuickBooks Online Integration for CiviCRM
repo_url: https://github.com/agileware/au.com.agileware.civiquickbooks
site_description: 'A guide for the QuickBooks Online Integration CiviCRM extension.'
site_author: 'agileware'
theme:
  name: material

nav:
  - 'Introduction': README.md
  - 'How it works': how-it-works.md
  - 'Installation': installation.md
  - 'Configuration': configuration.md
  - 'App assessment questionnaire': app-assessment-questionnaire.md
  - 'Mapping financial accounts': financial-account-mapping.md
  - 'Initial sync': initial-sync.md
  - 'Usage': usage.md
  - 'Troubleshooting': troubleshooting.md
  - 'Changes in this version': changelog.md

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - codehilite
  - toc:
      permalink: True
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.mark

plugins:
  - search:
      lang: en
